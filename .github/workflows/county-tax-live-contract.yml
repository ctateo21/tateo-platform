name: County tax live contract check

on:
  schedule:
    # Monday at 14:17 UTC, offset from busier top-of-hour schedules.
    - cron: "17 14 * * 1"
  workflow_dispatch:

# The workflow only needs to read the repository and create/update a failure
# alert issue. APIFY_TOKEN is read from GitHub Actions secrets at run time.
permissions:
  contents: read
  issues: write

concurrency:
  group: county-tax-live-contract
  cancel-in-progress: false

jobs:
  county-tax-live-contract:
    name: Live county tax provider contract
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run live county tax contract check
        id: county_tax_contract
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          set -o pipefail
          npm run test:live:county-tax 2>&1 | tee county-tax-live-contract.log

      - name: Retain failed contract-check output
        if: failure() && steps.county_tax_contract.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: county-tax-live-contract-failure-${{ github.run_id }}
          path: county-tax-live-contract.log
          if-no-files-found: error
          retention-days: 90

      - name: Alert maintainers about a provider failure
        if: failure() && steps.county_tax_contract.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[Automated] County tax live contract check is failing";
            const runUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "The scheduled live county tax provider contract check failed.",
              "",
              `Review the [failed workflow run](${runUrl}) and download its \`county-tax-live-contract-failure-${context.runId}\` artifact for the complete test output.`,
              "",
              "This can indicate provider contract drift or a temporary county/provider outage. Do not rotate a fixture until the upstream response has been confirmed to have legitimately changed.",
            ].join("\n");

            const { data } = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`,
              per_page: 100,
            });
            const existing = data.items.find(issue => issue.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                assignees: [context.repo.owner],
              });
            }